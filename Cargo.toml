# Vercel builds the Rust functions in api/ from this package (one [[bin]] per function).
[package]
name = "trinity-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
trinity-core = { path = "crates/trinity-core" }
tokio = { version = "1", features = ["full"] }
vercel_runtime = "2"
serde_json = "1"
form_urlencoded = "1"

[[bin]]
name = "handler"
path = "api/handler.rs"

[workspace]
members = [".", "crates/trinity-core", "crates/dev-server"]
exclude = ["web/src-tauri"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
